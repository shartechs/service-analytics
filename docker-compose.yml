services:
  postgres:
    image: postgres:16-alpine
    container_name: khma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-khma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khma_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-khma}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - khma_pgdata:/var/lib/postgresql/data
      # Auto-runs on first boot of an empty data volume — creates the waitlist table.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-khma} -d ${POSTGRES_DB:-khma}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  khma_pgdata:
    name: khma_pgdata
